[package]
name = "rcam-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
